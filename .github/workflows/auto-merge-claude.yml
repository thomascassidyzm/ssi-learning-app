name: Auto-merge claude/ branches to dev

# SSi Learning App branch policy (see CLAUDE.md):
#   dev      → rapid integration. Tom's rapid work + all claude/* web
#              sessions land here. Deploys to dev.saysomethingin.app.
#   staging  → stable soak. The external/Colombo test team vets it here
#              (staging.saysomethingin.app). Promoted from dev when green.
#   main     → production (saysomethingin.app). Promoted from staging.
# So claude/* branches from Claude Code web auto-merge to DEV, not staging
# or main. Promotion dev→staging→main is manual (see CLAUDE.md).

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

# One live run per branch. A rapid second push supersedes the first: the newer
# run verifies and merges the branch TIP, which already contains the older
# commit, so cancelling loses no work — only the wasted minutes.
concurrency:
  group: auto-merge-claude-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: the branch must pass the four feedback loops before it can merge to
  # dev. Kept in-file (rather than relying on the separate verify.yml) because a
  # separate workflow does NOT block this merge job — only an in-file needs: does.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the floating v4 tag resolved to on 2026-08-25)
        with:
          version: 8.15.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (what the floating v4 tag resolved to on 2026-08-25)
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build @ssi/core
        run: pnpm --filter @ssi/core build

      - name: Player lint
        run: pnpm --filter player-vue lint

      - name: Player typecheck
        run: pnpm --filter player-vue typecheck

      - name: API typecheck
        run: pnpm typecheck:api

      - name: Player tests
        run: pnpm --filter player-vue test

      - name: API tests
        run: pnpm test:api

      - name: Release-train tests
        run: pnpm test:release-train

  merge-to-dev:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Refresh in case dev moved since checkout
          git fetch origin dev

          # Skip if branch is already an ancestor of dev
          if git merge-base --is-ancestor origin/${{ github.ref_name }} origin/dev; then
            echo "Branch already merged into dev — nothing to do"
            exit 0
          fi

          git checkout dev
          git merge origin/${{ github.ref_name }} --no-edit
          git push origin dev
