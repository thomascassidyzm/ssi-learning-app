<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#D9D6D2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SaySomethingin" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- App Info -->
    <meta name="description" content="Learn languages naturally with SaySomethingin - the immersive audio-based learning experience" />
    <meta name="application-name" content="SaySomethingin" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- manifest injected by vite-plugin-pwa -->

    <!-- No font links here, by design, and no preconnect either — the fonts are
         SELF-HOSTED as of 2026-08-26 (Tom's ruling A-265). They live in
         public/fonts/, the UI's own Latin faces are precached by the service
         worker, and the one stylesheet is appended from JS by
         utils/loadWebFonts.ts with media="print" until it has actually
         arrived. There is no font host left to preconnect to.

         Do NOT put a <link rel="stylesheet"> to a font host back in this head.
         It blocks paint until it loads or fails, and on a weak signal it does
         neither — it hangs. That was the permanent white screen of 2026-08-25
         (Tom, phone, airport): the document arrived, nothing painted, and
         because this head is parsed top-down, the boot watchdog below never ran
         either. -->

    <title>SaySomethingin</title>

    <style>
      /* Critical CSS for fast first paint — Mist palette (warm-grey canvas,
         warm-dark-brown ink), matching design-tokens.css's --bg-primary /
         --text-primary. Pre-hydration only; the app CSS takes over once
         mounted. Was #050508/#fff (leftover from the deprecated dark
         "cosmos" theme) — kept the boot flash black on every cold open. */
      html {
        background: #e8e3dd;
      }

      html, body {
        margin: 0;
        padding: 0;
        background: #e8e3dd;
        color: #2C2622;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
      }

      /* Prevent pull-to-refresh on Chrome Android */
      body {
        overscroll-behavior-y: contain;
      }

      /* Safe area handling - let components manage their own insets */
      #app {
        min-height: 100vh;
        min-height: 100dvh;
        /* Safe area padding handled by individual components */
      }

      /* Loading state */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
      }

      .app-loading::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid rgba(194, 58, 58, 0.2);
        border-top-color: #c23a3a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Boot-heal message + floor screen (below) — painted by the inline
         watchdog, which runs before any app CSS is available. Kept minimal
         and self-contained on purpose. */
      .ssi-boot-heal,
      .ssi-boot-floor {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        height: 100vh;
        height: 100dvh;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }

      .ssi-boot-heal p,
      .ssi-boot-floor p {
        margin: 0;
        font-size: 16px;
        opacity: 0.85;
      }

      .ssi-boot-floor button {
        font-family: inherit;
        font-size: 17px;
        font-weight: 600;
        color: #ffffff;
        background: #c23a3a;
        border: none;
        border-radius: 12px;
        padding: 14px 28px;
        min-height: 48px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-loading"></div>
    <script>
      // Boot watchdog — inline, outside the service worker, no imports (it
      // must run even when every module fetch fails). Armed only when a SW
      // already controls this page: a slow FIRST visit (no SW yet) must
      // never trigger cache-nuking. See utils/bootHeal.ts for the unit-
      // tested decision logic this hand-mirrors, and
      // docs/pwa-lifecycle-design.md §2.1 for the full design.
      (function () {
        if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;

        var MAX_ATTEMPTS = 2;
        var ATTEMPT_KEY = 'ssi-boot-heal-attempts';
        var SWAP_KEY = 'ssi-boot-shell-swapped';
        var SWAP_GUARD_MS = 30000;
        var PRESERVE_CACHES = ['ssi-auth-handoff'];
        var healTriggered = false;

        // Lie-fi: navigator.onLine is TRUE, requests are accepted and then
        // hang forever. Only a real answer proves a live network — and only a
        // live network can justify deleting the SW + precache. 2s, because
        // anything slower than that is a network we must not trust anyway.
        // Mirrors shouldHealOnBootFailure(networkAnswered) in utils/bootHeal.ts.
        function networkAnswers() {
          return new Promise(function (resolve) {
            var settled = false;
            function done(v) { if (!settled) { settled = true; resolve(v); } }
            setTimeout(function () { done(false); }, 2000);
            try {
              fetch(window.location.origin + '/favicon.ico?boot-probe=' + Date.now(), {
                cache: 'no-store',
                credentials: 'omit',
              }).then(function () { done(true); }, function () { done(false); });
            } catch (e) { done(false); }
          });
        }

        // The swap guard exists to stop a cached shell that ALSO fails to mount
        // from swapping itself in forever. It must not outlive a success: a
        // learner who reloads twice on a weak signal has to be rescued twice,
        // which is the difference between a slow boot and Tom's "permanent"
        // white screen. So a boot that reaches mount clears the guard.
        var bootedWatch = setInterval(function () {
          if (!window.__SSI_BOOTED) return;
          clearInterval(bootedWatch);
          try { sessionStorage.removeItem(SWAP_KEY); } catch (e) { /* storage blocked */ }
        }, 500);
        setTimeout(function () { clearInterval(bootedWatch); }, 60000);

        function readAttempts() {
          try { return parseInt(sessionStorage.getItem(ATTEMPT_KEY), 10) || 0; }
          catch (e) { return 0; }
        }
        function writeAttempts(n) {
          try { sessionStorage.setItem(ATTEMPT_KEY, String(n)); } catch (e) { /* storage blocked */ }
        }

        function showHealMessage() {
          var el = document.getElementById('app');
          if (!el) return;
          el.className = 'ssi-boot-heal';
          el.innerHTML = '<p>Updating the app…</p>';
        }

        // Tom's ruling: the floor is ONE button that does everything itself.
        // No instructions, no mention of caching/service-workers/menus, no
        // pointer at /reset — the user should never need to understand why
        // the app is broken, only that tapping this fixes it.
        function showFloor() {
          var el = document.getElementById('app');
          if (!el) return;
          el.className = 'ssi-boot-floor';
          el.innerHTML = '<p>The app needs a fix.</p><button type="button" id="ssi-fix-app-btn">Fix the app</button>';
          var btn = document.getElementById('ssi-fix-app-btn');
          if (btn) btn.addEventListener('click', fullHeal);
        }

        // The "Updating the app…" screen must NEVER hang. Two ways it can
        // (both observed on iOS standalone PWAs): a Cache API / SW-unregister
        // promise that never settles, and a location.reload() that silently
        // doesn't take. So: cleanup races a hard deadline, reload fires
        // exactly once either way, and a wedge timer behind the reload
        // escalates to a tap-to-relaunch button — the tap is a user gesture,
        // which is exactly what unsticks a wedged webview.
        // Constants mirrored in utils/bootHeal.ts (HEAL_DEADLINE_MS /
        // RELOAD_WEDGE_MS) — keep in lockstep.
        var HEAL_DEADLINE_MS = 4000;
        var RELOAD_WEDGE_MS = 2500;

        function showRelaunch() {
          var el = document.getElementById('app');
          if (!el) return;
          el.className = 'ssi-boot-floor';
          el.innerHTML = '<p>Update ready.</p><button type="button" id="ssi-relaunch-btn">Tap to relaunch</button>';
          var btn = document.getElementById('ssi-relaunch-btn');
          if (btn) btn.addEventListener('click', function () { window.location.reload(); });
        }

        function fullHeal() {
          var unregister = ('serviceWorker' in navigator)
            ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
            : Promise.resolve();

          var clearCaches = ('caches' in window)
            ? caches.keys().then(function (names) {
                return Promise.all(names
                  .filter(function (n) { return PRESERVE_CACHES.indexOf(n) === -1; })
                  .map(function (n) { return caches.delete(n); }));
              })
            : Promise.resolve();

          var reloaded = false;
          function reloadOnce() {
            if (reloaded) return;
            reloaded = true;
            setTimeout(showRelaunch, RELOAD_WEDGE_MS);
            window.location.reload();
          }

          // Hard deadline: if cleanup promises hang, reload anyway — the
          // next boot re-runs the ladder against whatever cleanup did land.
          setTimeout(reloadOnce, HEAL_DEADLINE_MS);

          // IndexedDB (audio, progress) and localStorage are deliberately
          // never touched here — a boot failure can only come from
          // HTML/JS/CSS, which live exclusively in SW caches.
          Promise.all([unregister, clearCaches])
            .catch(function () { /* best-effort — reload regardless */ })
            .then(reloadOnce);
        }

        // Weak-signal recovery: start the copy of the app we already hold.
        // On a weak signal a small index.html can arrive inside the service
        // worker's 3s navigation timeout while the hashed chunks it names
        // cannot — and sub-resource fetches have no timeout, so the shell
        // paints and the app never mounts. The precached shell names chunks
        // that are precached by construction, so swapping it in mounts
        // immediately. Mirrors shouldServeCachedShell() in utils/bootHeal.ts.
        function serveCachedShell() {
          if (window.__SSI_BOOTED) return;
          // Time-expiring guard, mirroring isSwapGuardActive() in
          // utils/bootHeal.ts: a cached shell that also fails would re-swap
          // within seconds, but a learner reloading later on the same bad
          // signal must be rescued again. It cannot rely on being cleared by
          // the swapped-in document, whose inline script the CSP hash blocks
          // whenever the cached shell comes from a different build.
          try {
            var swappedAt = parseInt(sessionStorage.getItem(SWAP_KEY), 10);
            if (swappedAt && Date.now() - swappedAt < SWAP_GUARD_MS) return;
          } catch (e) { /* storage blocked */ }
          if (!('caches' in window)) return;
          caches.match('/index.html', { ignoreSearch: true }).then(function (res) {
            if (!res || window.__SSI_BOOTED) return;
            return res.text().then(function (html) {
              if (window.__SSI_BOOTED || !html) return;
              try { sessionStorage.setItem(SWAP_KEY, String(Date.now())); } catch (e) { /* storage blocked */ }
              // Replacing the document tears down the hanging entry chunk's
              // context too — nothing is left waiting on a network that will
              // never answer.
              document.open();
              document.write(html);
              document.close();
            });
          }).catch(function () { /* nothing cached to fall back to */ });
        }

        function heal() {
          if (healTriggered) return;
          healTriggered = true;
          var attempts = readAttempts();
          if (attempts >= MAX_ATTEMPTS) {
            showFloor();
            return;
          }
          writeAttempts(attempts + 1);
          showHealMessage();
          fullHeal();
        }

        // Fast path: a failed script/module load anywhere in the entry graph.
        // Two guards (mirrored in utils/bootHeal.ts — shouldHealOnBootFailure
        // + isDeployFatalResourceUrl):
        //  - A MISSING NETWORK is not a broken deploy. Healing deletes the SW
        //    + precache — the only thing that makes the app work offline — so
        //    an airplane-mode boot must never trip this, and neither must a
        //    weak signal. The test is whether the network actually answered,
        //    NOT navigator.onLine: on lie-fi that flag says "online" while
        //    every request hangs, which is exactly how a bad signal used to
        //    end in a permanent white screen (2026-08-16).
        //  - Only SAME-ORIGIN failures count. The entry graph lives on our
        //    origin (it's what the SW precaches); Google Fonts being down or
        //    ad-blocked must never nuke the install.
        window.addEventListener('error', function (evt) {
          if (window.__SSI_BOOTED) return;
          var target = evt && evt.target;
          if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK')) return;
          var url = target.src || target.href || '';
          if (url.indexOf(window.location.origin + '/') !== 0) return;
          networkAnswers().then(function (answered) {
            if (window.__SSI_BOOTED) return;
            if (answered) heal();
            else serveCachedShell();
          });
        }, true);

        // Weak-signal path: the boot has stalled with no error to react to,
        // because the chunk fetches are simply hanging. Long before the
        // deploy-broken deadline, stop waiting and start what we already have.
        // Mirrors CACHED_SHELL_FALLBACK_MS in utils/bootHeal.ts.
        setTimeout(function () {
          if (!window.__SSI_BOOTED) serveCachedShell();
        }, 3000);

        // Slow path: mount never happened, and nothing we hold could fix it.
        // Same guard as the fast path — never heal without proof of a live
        // network to rebuild from.
        setTimeout(function () {
          if (window.__SSI_BOOTED) return;
          networkAnswers().then(function (answered) {
            if (!window.__SSI_BOOTED && answered) heal();
          });
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
