<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>My Progress — SSi Schools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./colors_and_type.css"><link rel="stylesheet" href="schools.css">
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="./components/schools-data.jsx"></script>
<script type="text/babel" src="./components/schools-shared.jsx"></script>
<script type="text/babel">
function StudentProgress() {
  const s = window.SSI_STUDENTS.find(x=>x.id==='s11'); // Erwann Floch, 5ème, orange belt
  const cls = window.SSI_CLASSES.find(c=>c.id===s.classId);
  return (
    <Stage bg="#fdf9f0">
      <header style={{height:54, display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'0 24px', background:'#fff', borderBottom:'1px solid var(--schools-border)', flex:'none'}}>
        <Logo/>
        <div style={{display:'flex', alignItems:'center', gap:12}}>
          <span style={{fontSize:12.5, color:'var(--schools-fg-2)'}}>{cls.name} · {window.SSI_SCHOOL.name}</span>
          <div style={{width:30, height:30, borderRadius:'50%', background:'var(--schools-belt-orange)',
            display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:600, color:'#5a2e0c'}}>EF</div>
        </div>
      </header>
      <main style={{padding:'30px 56px 0', height:'calc(100% - 54px)', overflow:'auto'}}>
        <div style={{display:'grid', gridTemplateColumns:'1.3fr 1fr', gap:32}}>
          <div>
            <div style={{fontSize:11, color:'var(--schools-fg-2)', letterSpacing:'.08em',
              textTransform:'uppercase', fontWeight:600, marginBottom:6}}>Wednesday · 12 May</div>
            <h1 className="arsenal" style={{fontSize:48, lineHeight:1.05, letterSpacing:'-0.01em'}}>
              Demat, Erwann.<br/>You're on a 9-day streak.
            </h1>
            <p style={{fontSize:15, color:'var(--schools-fg-2)', maxWidth:520, marginTop:14, lineHeight:1.55}}>
              You've retired 34 LEGOs in {cls.course}. Six more to your green belt. Your last session was an hour ago — pick up where you left off?
            </p>
            <div style={{display:'flex', gap:10, marginTop:22}}>
              <button className="btn-play" style={{padding:'13px 24px', fontSize:15}}>▶ Keep going — LEGO 35</button>
              <button className="btn-ghost">Pick a different LEGO</button>
            </div>
          </div>

          <div style={{display:'flex', flexDirection:'column', gap:14}}>
            <div className="card card-pad" style={{display:'flex', alignItems:'center', gap:16}}>
              <div style={{width:64, height:64, borderRadius:'50%', background:'var(--schools-belt-orange)',
                boxShadow:'inset 0 0 0 3px rgba(0,0,0,.15)'}}/>
              <div>
                <div className="kicker" style={{marginBottom:4}}>Current belt</div>
                <div className="arsenal" style={{fontSize:26, lineHeight:1}}>Orange</div>
                <div style={{fontSize:12, color:'var(--schools-fg-2)', marginTop:2}}>6 LEGOs to Green</div>
              </div>
            </div>

            <div className="card card-pad">
              <div className="kicker" style={{marginBottom:8}}>Your journey</div>
              <Journey done={s.legoDone} total={s.legoTotal*2} label="LEGOs retired"/>
              <div style={{display:'flex', gap:12, marginTop:14, justifyContent:'space-between'}}>
                {[
                  ['9d','Streak'],['2.6h','This week'],['18m','Avg session'],
                ].map(([v,l])=>(
                  <div key={l} style={{textAlign:'center'}}>
                    <div className="arsenal" style={{fontSize:22, lineHeight:1}}>{v}</div>
                    <div style={{fontSize:11, color:'var(--schools-fg-2)', marginTop:2}}>{l}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="card card-pad" style={{background:'#fff', border:'1px dashed var(--schools-border-strong)'}}>
              <div className="kicker" style={{marginBottom:6}}>Last 7 days</div>
              <Spark data={[1.8,2.1,2.6,2.0,2.8,1.4,2.2]} w={260} h={42}/>
              <div style={{fontSize:11.5, color:'var(--schools-fg-2)', marginTop:6}}>
                Sun – Sat · hours practised
              </div>
            </div>
          </div>
        </div>
      </main>
    </Stage>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<StudentProgress/>);
</script></body></html>
