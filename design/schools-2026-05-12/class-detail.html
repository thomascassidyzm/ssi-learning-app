<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Class detail — SSi Schools</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./colors_and_type.css">
<link rel="stylesheet" href="schools.css">
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="./components/schools-data.jsx"></script>
<script type="text/babel" src="./components/schools-shared.jsx"></script>
<script type="text/babel">

function ClassDetailScreen() {
  const id = new URLSearchParams(location.search).get('id') || '5eme';
  const c = window.SSI_CLASSES.find(x => x.id === id) || window.SSI_CLASSES[1];
  const students = window.SSI_STUDENTS.filter(s => s.classId === c.id);

  return (
    <ScreenShell active="Dashboard">
      <main style={{padding:'22px 32px 0', height:'calc(100% - 54px)', overflow:'hidden'}}>
        {/* Breadcrumb + page head */}
        <div style={{fontSize:12.5, color:'var(--schools-fg-2)', marginBottom:10}}>
          <a href="dashboard.html" style={{color:'inherit', textDecoration:'none'}}>Dashboard</a>
          <span style={{margin:'0 8px', opacity:.4}}>/</span>
          <span style={{color:'var(--schools-fg)'}}>{c.name}</span>
        </div>

        <div style={{display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:18, gap:24}}>
          <div>
            <div style={{fontSize:11, color:'var(--schools-red)', letterSpacing:'.08em', textTransform:'uppercase', fontWeight:600, marginBottom:6}}>
              {c.course}
            </div>
            <h1 className="arsenal" style={{fontSize:34, lineHeight:1.05}}>{c.name}</h1>
            <div style={{display:'flex', alignItems:'center', gap:14, fontSize:13, color:'var(--schools-fg-2)', marginTop:8}}>
              <span style={{display:'inline-flex', alignItems:'center', gap:6}}>
                <BeltDot belt={c.classBelt} size={12} ring/>
                {c.classBelt[0].toUpperCase()+c.classBelt.slice(1)} belt class
              </span>
              <span style={{opacity:.3}}>·</span>
              <span>{c.students} students</span>
              <span style={{opacity:.3}}>·</span>
              <span>Taught by {c.teacher}</span>
            </div>
          </div>
          <div style={{display:'flex', gap:8, alignItems:'center'}}>
            <button className="btn-ghost">Settings</button>
            <button className="btn-ghost">Invite students</button>
            <button className="btn-play" style={{padding:'12px 22px', fontSize:14.5}}>▶ Play as class</button>
          </div>
        </div>

        {/* Two-column body */}
        <div style={{display:'grid', gridTemplateColumns:'1.6fr 1fr', gap:14}}>
          {/* Roster */}
          <div className="card" style={{overflow:'hidden', height: 538}}>
            <div style={{padding:'12px 16px', borderBottom:'1px solid var(--schools-border)',
              display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <h3 className="arsenal" style={{fontSize:17}}>Roster</h3>
              <div style={{display:'flex', gap:8, alignItems:'center'}}>
                <input placeholder="Search students…" style={{
                  padding:'5px 10px', fontSize:12, border:'1px solid var(--schools-border)',
                  borderRadius:6, background:'#fafaf6', fontFamily:'var(--font-body)', width:180,
                }}/>
                <button className="btn-ghost btn-small">+ Add</button>
              </div>
            </div>
            <div style={{overflow:'auto', height:'calc(100% - 50px)'}}>
              <table className="ssi-table">
                <thead>
                  <tr><th>Student</th><th>Belt</th><th>LEGOs</th><th>This week</th><th>Streak</th><th>Last active</th><th></th></tr>
                </thead>
                <tbody>
                  {students.map(s => (
                    <tr key={s.id}>
                      <td>
                        <div style={{display:'flex', alignItems:'center', gap:10}}>
                          <div style={{
                            width:28, height:28, borderRadius:'50%', background:'#eee',
                            display:'flex', alignItems:'center', justifyContent:'center',
                            fontSize:11, fontWeight:600, color:'#555',
                          }}>{s.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div>
                          <div style={{display:'flex', flexDirection:'column', gap:2, lineHeight:1.3, minWidth:0}}>
                            <div style={{fontWeight:600, fontSize:13.5, lineHeight:1.3}}>{s.name}</div>
                            <div style={{fontSize:11, color:'var(--schools-fg-2)', lineHeight:1.3, display:'flex', alignItems:'center', gap:4}}>
                              <HealthDot health={s.health}/><span>{s.health.replace('-',' ')}</span>
                            </div>
                          </div>
                        </div>
                      </td>
                      <td><span style={{display:'inline-flex', alignItems:'center', gap:6}}><BeltDot belt={s.belt} size={14}/>{s.belt}</span></td>
                      <td><span style={{color:'var(--schools-fg-2)'}}>{s.legoDone}/{s.legoTotal}</span></td>
                      <td>{s.hours7d}h</td>
                      <td>{s.streak>0 ? `${s.streak}d 🔥` : '—'}</td>
                      <td><span style={{color:'var(--schools-fg-2)'}}>{s.lastActive}</span></td>
                      <td style={{textAlign:'right'}}>
                        <a href="student-progress.html" style={{fontSize:12, color:'var(--schools-red)', textDecoration:'none', fontWeight:600}}>View →</a>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Side rail */}
          <div style={{display:'flex', flexDirection:'column', gap:14}}>
            <div className="card card-pad">
              <div className="kicker" style={{marginBottom:8}}>Course Journey</div>
              <Journey done={c.journey.done} total={c.journey.total}/>
              <div style={{fontSize:12, color:'var(--schools-fg-2)', marginTop:8, lineHeight:1.5}}>
                {c.journey.done} LEGOs retired across the class.<br/>
                Next milestone: Level 2 (LEGO 40).
              </div>
            </div>

            <div className="card card-pad">
              <div className="kicker" style={{marginBottom:10}}>Belt distribution</div>
              <BeltStrip dist={c.beltDist}/>
              <div style={{display:'flex', justifyContent:'space-between', marginTop:10}}>
                {Object.entries(c.beltDist).map(([b,n]) => (
                  <div key={b} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:4}}>
                    <BeltDot belt={b} size={22} ring/>
                    <div className="arsenal" style={{fontSize:18, lineHeight:1}}>{n}</div>
                    <div style={{fontSize:10.5, color:'var(--schools-fg-2)', textTransform:'capitalize'}}>{b}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="card card-pad">
              <div className="kicker" style={{marginBottom:8}}>Practice min/student/week</div>
              <Bench data={c.bench}/>
            </div>

            <div className="card card-pad" style={{background:'#fdf6df', borderColor:'#f0d97a'}}>
              <div className="kicker" style={{color:'#7a5418', marginBottom:6}}>Join code</div>
              <div style={{fontFamily:'monospace', fontSize:22, letterSpacing:'.1em', color:'var(--schools-fg)'}}>{c.joinCode}</div>
              <div style={{fontSize:12, color:'var(--schools-fg-2)', marginTop:4}}>
                Students enter this on saysomethingin.com/join to be added to the class.
              </div>
            </div>
          </div>
        </div>
      </main>
    </ScreenShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ClassDetailScreen/>);
</script>
</body>
</html>
